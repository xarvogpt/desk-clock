<title>책상 시계</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 레이아웃: 검은 화면을 세로 실선 하나로 나눔. 왼쪽은 60분 링 타이머 + 시각, 오른쪽은 날짜·달력·날씨. 세로 화면이면 위아래로 쌓음 */
:root {
  --bg: #000000;
  --panel: #111110;
  --fg: #f1efea;
  --muted: #7f7b75;
  --line: #262523;
  --ring-off: #1d1c1b;
  --accent: #ff5631;
  --sun: #ff705a;
  --sat: #7aa2ff;
  --bar-a: #2b2a28;
  --bar-b: #6e6a64;
  /* 카드: 검정 테마에서는 안 보이게(투명, 여백 0), 밝게 테마에서는 회색 카드 */
  --card: transparent;
  --card-solid: #000000;   /* 카드 실제 바탕색(투명이면 화면 바탕색). 진행선 위 점 테두리에 씀 */
  --card-pad: 0px;
  --app-gap: 0px;
  --side-pad: 3.2vw;
  --side-rule: var(--line);
  --w-display: 300;
  --w-top: auto;
  --cal-grow: 0;
  --f-digit: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
/* 밝게: 화면 전체 상아색 바탕(카드 없이 검정 테마와 같은 배치), 검은 글자, 번트 오렌지 포인트 */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3efe4; --panel: #fbf8f0; --fg: #1b1a17; --muted: #7a756b; --line: #dbd4c4;
    --ring-off: #e2dbcb; --accent: #bf5a2c; --sun: #bf5a2c; --sat: #2f55a0; --bar-a: #1b1a17; --bar-b: #c4bdae;
    --card: transparent; --card-solid: #f3efe4; --card-pad: 0px; --app-gap: 0px; --side-pad: 3.2vw; --side-rule: var(--line);
    --w-display: 500; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3efe4; --panel: #fbf8f0; --fg: #1b1a17; --muted: #7a756b; --line: #dbd4c4;
  --ring-off: #e2dbcb; --accent: #bf5a2c; --sun: #bf5a2c; --sat: #2f55a0; --bar-a: #1b1a17; --bar-b: #c4bdae;
  --card: transparent; --card-solid: #f3efe4; --card-pad: 0px; --app-gap: 0px; --side-pad: 3.2vw; --side-rule: var(--line);
  --w-display: 500; color-scheme: light;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-weight: 300;
  font-variant-numeric: tabular-nums;   /* 숫자 폭을 같게 해서 초가 바뀔 때 글자가 흔들리지 않게 */
  box-sizing: border-box; overflow: hidden;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: var(--app-gap); }
.card { background: var(--card); border-radius: 22px; padding: var(--card-pad); }

/* 왼쪽: 시계 + 타이머 */
.clock { min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4vh; padding-right: max(var(--card-pad), 2vw); }
.ring { width: min(100%, 78vh); max-width: 100%; aspect-ratio: 1; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
.ring .seg { fill: var(--ring-off); }
.ring .seg.on { fill: var(--accent); }
.ring .seg { transform-box: fill-box; transform-origin: center; }
.ring .seg.fold { animation: fold .65s cubic-bezier(.5, 0, .3, 1); }
@keyframes fold {
  0%   { fill: var(--accent); transform: scale(1); }
  45%  { fill: var(--accent); transform: scale(.35) rotate(-25deg); }
  70%  { fill: var(--ring-off); transform: scale(.35) rotate(-25deg); }
  100% { fill: var(--ring-off); transform: scale(1); }
}
.ring .tick { fill: var(--muted); font-family: var(--f-digit); font-size: 6.5px; }
.ring .now { fill: var(--fg); font-family: var(--f-digit); font-size: 27px; font-weight: 800; letter-spacing: -1px; font-feature-settings: "tnum"; }
.ring .now .sec { fill: var(--muted); }
.ring .ampm { fill: var(--muted); font-size: 7px; letter-spacing: 1px; }
.ring .timer { fill: var(--accent); font-family: var(--f-digit); font-size: 15px; font-weight: 800; font-feature-settings: "tnum"; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
/* 시작 버튼 안 그림: 멈춤이면 ▶, 돌아가는 중이면 ‖ */
.btn.primary { display: inline-flex; align-items: center; justify-content: center; gap: .5em; }
.go-icon { width: .75em; height: .75em; fill: currentColor; }
.btn { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: .55em 1.15em; font-size: clamp(14px, 2vh, 18px); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; min-width: 6.5em; }
.btn.chip { font-family: var(--f-digit); color: var(--muted); font-size: clamp(13px, 1.8vh, 16px); padding: .45em .95em; }

/* 오른쪽: 날짜·달력·날씨 */
.side { min-height: 0; min-width: 0; border-left: 1px solid var(--side-rule); padding: 0 0 0 var(--side-pad); display: flex; flex-direction: column; gap: max(var(--app-gap), 3.2vh * (1 - var(--cal-grow))); overflow: hidden; }
/* 날짜: 일력처럼 큰 "일" 숫자 + 월·요일, 아래에 올해 지나간 비율 막대 */
.side-top { display: flex; flex-direction: column; }
.w-card { position: relative; }
/* 버튼 둘레의 투명한 누름 영역만큼 바깥으로 당기되, 카드 여백이 0인 테마에서 패널 밖으로 나가 잘리지 않게 0 아래로는 안 내려감 */
.w-card .icons { position: absolute; top: max(0px, calc(var(--card-pad) - 12px)); right: max(0px, calc(var(--card-pad) - 10px)); }
.day-block { display: flex; align-items: center; gap: clamp(10px, 1.6vw, 20px); }
.yr-big { margin-left: auto; align-self: flex-end; text-align: right; }
.yr-pct { font-size: clamp(30px, 6.4vh, 58px); font-weight: 800; line-height: 1; letter-spacing: -.02em; font-feature-settings: "tnum"; }
.yr-left { color: var(--muted); font-size: clamp(12px, 1.9vh, 16px); margin-top: .4vh; }
.day { font-size: clamp(64px, 14vh, 124px); font-weight: 800; line-height: .85; letter-spacing: -.04em; font-feature-settings: "tnum"; }
.day-side { display: flex; flex-direction: column; gap: .2em; font-size: clamp(18px, 3.6vh, 32px); line-height: 1.1; }
.month { font-weight: 700; }
.dow { font-weight: 500; color: var(--accent); }
.dow.sun { color: var(--sun); }
.dow.sat { color: var(--sat); }
/* 올해 진행: 가는 실선 하나 + 오늘 위치 점, 아래에 달 이름 (칸 없이 매끈하게 해서 타이머 링과 겹쳐 보이지 않게) */
.year-line { position: relative; height: 4px; border-radius: 2px; background: var(--ring-off); margin-top: 3vh; }
.year-line i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--accent); }
.year-line b { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); transform: translate(-50%, -50%); box-shadow: 0 0 0 4px var(--card-solid); }
.year-ticks { position: relative; height: 1.4em; margin-top: 1.2vh; color: var(--muted); font-size: clamp(11px, 1.7vh, 14px); }
.year-ticks span { position: absolute; top: 0; white-space: nowrap; }
.icons { display: flex; gap: 4px; flex-shrink: 0; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; opacity: .6; }
.icon-btn:hover { opacity: 1; }
.icon-btn svg { width: 22px; height: 22px; stroke: var(--fg); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: .4vh 0; align-content: center; text-align: center; font-family: var(--f-digit); font-size: clamp(13px, 2.4vh, 22px); flex-grow: 1; }
.cal .h { font-family: var(--f-body); color: var(--muted); font-size: .78em; padding-bottom: .6vh; }
.cal span { padding: .5vh 0; border-radius: 999px; }
.cal .sun { color: var(--sun); }
.cal .sat { color: var(--sat); }
.cal .past { opacity: .35; }
.cal .today { background: var(--accent); color: #fff; opacity: 1; font-weight: 500; }
.cal .blank { visibility: hidden; }

.weather { display: flex; flex-direction: column; gap: 1.4vh; }
.w-head { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: clamp(12px, 1.9vh, 16px); font-weight: 400; }
.w-main { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 0 1.6vw; align-items: center; }
.w-icon { width: clamp(64px, 15vh, 140px); height: auto; display: block; }
.w-icon .sun { fill: var(--accent); }
.w-icon .cloud { fill: var(--fg); }
.w-icon .cloud.dim { fill: var(--muted); }
.w-icon .drop { stroke: var(--accent); stroke-width: 5; stroke-linecap: round; fill: none; }
.w-icon .flake { fill: var(--accent); }
.w-icon .fog { stroke: var(--muted); stroke-width: 5; stroke-linecap: round; }
.w-temp { font-family: var(--f-digit); font-weight: var(--w-display); font-size: clamp(40px, 10vh, 92px); line-height: .9; letter-spacing: -.04em; }
.w-cond { font-size: clamp(16px, 2.6vh, 24px); font-weight: 500; margin-bottom: .7vh; }
.w-bar { position: relative; height: clamp(14px, 3vh, 30px); border-radius: 6px; background: linear-gradient(90deg, var(--bar-a), var(--bar-b)); }
.w-bar i { position: absolute; top: 0; bottom: 0; width: 18%; min-width: 22px; border-radius: 6px; background: var(--accent); transform: translateX(-50%); }
.w-lh { display: flex; justify-content: space-between; color: var(--muted); font-size: clamp(12px, 1.8vh, 15px); margin-top: .5vh; }
.w-lh b { color: var(--fg); font-weight: 500; }
.w-meta { display: flex; flex-wrap: wrap; gap: .3em 1.4em; color: var(--muted); font-size: clamp(12px, 1.9vh, 16px); }
.w-meta b { color: var(--fg); font-weight: 500; font-family: var(--f-digit); }
.w-meta .w-time { margin-left: auto; }
.w-empty { color: var(--muted); font-size: clamp(14px, 2.1vh, 18px); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

/* 멈춰 있는 동안(시간을 맞췄지만 시작 전, 또는 일시정지)은 빨간 칸과 남은 시간이 천천히 숨 쉬듯 흐려졌다 돌아온다. 돌아가는 중에는 가만히 있음 */
body.paused .ring .seg.on, body.paused .ring .timer { animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .3; } }
/* 타이머 끝: 링과 가운데 시각만 깜빡임 */
body.ringing .ring .seg { animation: ring-blink 1s steps(1) infinite; }
body.ringing .ring .now, body.ringing .ring .timer { animation: text-blink 1s steps(1) infinite; }
@keyframes ring-blink { 0% { fill: var(--accent); } 50% { fill: var(--ring-off); } }
@keyframes text-blink { 50% { opacity: .2; } }

/* 설정 창 */
.sheet-wrap { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 16px; z-index: 20; }
.sheet { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 20px; width: min(520px, 100%); max-height: 100%; overflow: auto; padding: 24px; display: flex; flex-direction: column; gap: 22px; font-weight: 400; }
.sheet h2 { margin: 0; font-size: 20px; font-weight: 500; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field > .lbl { font-weight: 500; font-size: 15px; }
.field small { color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row input[type=text] { flex: 1; min-width: 0; padding: .6em .9em; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; }
.results { display: flex; flex-direction: column; gap: 4px; }
.results button { text-align: left; padding: .6em .9em; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
.seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; align-self: flex-start; }
.seg-ctl input { position: absolute; opacity: 0; pointer-events: none; }
.seg-ctl label { padding: .5em 1em; cursor: pointer; }
.seg-ctl input:checked + label { background: var(--accent); color: #fff; }
.seg-ctl input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }
.sheet .foot { display: flex; justify-content: flex-end; }

@media (max-aspect-ratio: 1/1), (max-width: 700px) {
  body { overflow: auto; height: auto; }
  .app { grid-template-columns: 1fr; height: auto; gap: 24px; }
  .clock { padding-right: var(--card-pad); }
  .ring { width: min(100%, 520px); }
  .side { border-left: 0; border-top: 1px solid var(--side-rule); padding: max(0px, 24px - var(--card-pad) * 99) 0 0; }
  .weather { margin-top: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .ring .seg.fold { animation: none; }
  body.paused .ring .seg.on, body.paused .ring .timer { animation: none; opacity: .5; }
  body.ringing .ring .seg { animation: none; fill: var(--accent); }
  body.ringing .ring .now, body.ringing .ring .timer { animation: none; }
}
</style>

<div class="app">
  <section class="clock card">
    <svg class="ring" id="ring" viewBox="-111 -111 222 222" aria-label="60분 타이머. 링을 끌어서 시간을 정하고 가운데를 눌러 시작">
      <g id="segs"></g>
      <g id="ticks"></g>
      <text id="tAmpm" class="ampm" x="0" y="-22" text-anchor="middle"></text>
      <text class="now" x="0" y="4" text-anchor="middle"><tspan id="tHM">--:--</tspan><tspan id="tSec" class="sec">:--</tspan></text>
      <text id="tTimer" class="timer" x="0" y="29" text-anchor="middle">00:00</text>
    </svg>
    <div class="controls">
      <button class="btn primary" id="bStart" type="button">
        <svg class="go-icon" viewBox="0 0 12 12" aria-hidden="true"><path id="goIcon" d="M3 1.5v9l7.5-4.5z"/></svg>
        <span id="bStartLabel">시작</span>
      </button>
      <button class="btn" id="bReset" type="button">초기화</button>
      <button class="btn chip" type="button" data-min="5">5분</button>
      <button class="btn chip" type="button" data-min="10">10분</button>
      <button class="btn chip" type="button" data-min="25">25분</button>
      <button class="btn chip" type="button" data-min="50">50분</button>
    </div>
  </section>

  <section class="side">
    <div class="card w-card">
      <div class="icons">
        <button class="icon-btn" id="bFull" type="button" aria-label="전체 화면">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <button class="icon-btn" id="bSettings" type="button" aria-label="설정">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
      <div class="weather" id="weather"></div>
    </div>

    <div class="side-top card">
      <div class="day-block">
        <div class="day" id="dDay"></div>
        <div class="day-side">
          <div class="month" id="dMonth"></div>
          <div class="dow" id="dDow"></div>
        </div>
        <div class="yr-big"><div class="yr-pct" id="yPct"></div><div class="yr-left" id="yLeft"></div></div>
      </div>
      <div class="year-line" aria-hidden="true"><i id="yFill"></i><b id="yDot"></b></div>
      <div class="year-ticks" id="yTicks" aria-hidden="true"></div>
    </div>

    <div class="cal card" id="cal" aria-label="이번 달 달력"></div>
  </section>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">설정</h2>

    <div class="field">
      <label for="placeQ">날씨 지역</label>
      <small id="placeNow">아직 고르지 않았어요</small>
      <form class="row" id="placeForm">
        <input type="text" id="placeQ" placeholder="예: 서울, 수원시, Busan" autocomplete="off">
        <button class="btn" type="submit">검색</button>
      </form>
      <div class="results" id="placeResults"></div>
    </div>

    <div class="field">
      <span class="lbl">타이머 끝 알림 소리</span>
      <div class="row">
        <div class="seg-ctl">
          <input type="radio" name="vol" id="v0" value="0"><label for="v0">끄기</label>
          <input type="radio" name="vol" id="v1" value="1"><label for="v1">작게</label>
          <input type="radio" name="vol" id="v2" value="2"><label for="v2">보통</label>
          <input type="radio" name="vol" id="v3" value="3"><label for="v3">크게</label>
        </div>
        <button class="btn" type="button" id="bTest">소리 시험</button>
      </div>
      <small>태블릿의 미디어 음량도 올려 두세요. 소리는 화면을 누를 때까지 계속 납니다(최대 3분).</small>
    </div>

    <div class="field">
      <span class="lbl">시각 표시</span>
      <div class="seg-ctl">
        <input type="radio" name="hfmt" id="h24" value="24"><label for="h24">24시간</label>
        <input type="radio" name="hfmt" id="h12" value="12"><label for="h12">오전/오후</label>
      </div>
    </div>

    <div class="field">
      <span class="lbl">화면 테마</span>
      <div class="seg-ctl">
        <input type="radio" name="theme" id="thDark" value="dark"><label for="thDark">검정</label>
        <input type="radio" name="theme" id="thLight" value="light"><label for="thLight">밝게</label>
        <input type="radio" name="theme" id="thAuto" value="auto"><label for="thAuto">기기 설정 따름</label>
      </div>
      <small>시각은 이 기기의 시계를 씁니다. 기기 설정에서 "자동 날짜 및 시간"을 켜 두세요.</small>
    </div>

    <div class="foot"><button class="btn primary" id="bClose" type="button">닫기</button></div>
  </div>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem('deskclock.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },

      store.set('weather', w); renderWeather(w);
    }).catch(function () {
      renderWeather(cached, cached ? '새로고침 실패' : '날씨를 불러오지 못했어요. 인터넷 연결을 확인하세요.');
    });
  }

  /* ---------- 설정 ---------- */
  function applyTheme() {
    if (settings.theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', settings.theme);
  }
  function saveSettings() { store.set('settings', settings); }
  function openSettings() {
    $('#placeNow').textContent = settings.place ? '현재: ' + placeLabel(settings.place) : '아직 고르지 않았어요';
    $(settings.hour12 ? '#h12' : '#h24').checked = true;
    $({ auto: '#thAuto', light: '#thLight', dark: '#thDark' }[settings.theme] || '#thDark').checked = true;
    $('#v' + settings.volume).checked = true;
    $('#placeResults').innerHTML = '';
    $('#sheetWrap').hidden = false;
  }
  function closeSettings() { $('#sheetWrap').hidden = true; }
  $('#bSettings').addEventListener('click', openSettings);
  $('#bClose').addEventListener('click', closeSettings);
  $('#sheetWrap').addEventListener('click', function (e) { if (e.target === this) closeSettings(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeSettings(); if (timer.status === 'done') reset(); } });
  Array.prototype.forEach.call(document.querySelectorAll('input[name=hfmt]'), function (r) {
    r.addEventListener('change', function () { settings.hour12 = r.value === '12'; saveSettings(); render(); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('input[name=theme]'), function (r) {
    r.addEventListener('change', function () { settings.theme = r.value; saveSettings(); applyTheme(); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('input[name=vol]'), function (r) {
    r.addEventListener('change', function () { settings.volume = +r.value; saveSettings(); ensureAudio(); beep(); });
  });
  $('#bTest').addEventListener('click', function () { ensureAudio(); beep(settings.volume || 3); });
  $('#placeForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var q = $('#placeQ').value.trim(), box = $('#placeResults');
    if (!q) return;
    box.innerHTML = '<small>찾는 중…</small>';
    // 한글 지명은 "서울"보다 "서울특별시"로 등록된 경우가 많아서 행정구역 이름을 붙여 함께 찾는다
    var qs = [q];
    if (/[가-힣]$/.test(q) && !/[시군구도읍면동]$/.test(q)) qs.push(q + '시', q + '특별시', q + '광역시');
    Promise.all(qs.map(function (s) {
      return fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=ko&name=' + encodeURIComponent(s))
        .then(function (r) { return r.json(); });
    }))
      .then(function (all) {
        var seen = {}, list = [];
        all.forEach(function (j) { (j.results || []).forEach(function (p) { if (!seen[p.id]) { seen[p.id] = 1; list.push(p); } }); });
        list.sort(function (a, b) { return (b.population || 0) - (a.population || 0); });
        list = list.slice(0, 6);
        if (!list.length) { box.innerHTML = '<small>"' + q.replace(/</g, '&lt;') + '"에 맞는 지역이 없어요. 다른 이름이나 영어로 찾아보세요.</small>'; return; }
        box.innerHTML = '';
        list.forEach(function (p) {
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = placeLabel(p) + (p.admin2 && p.admin2 !== p.name ? ' ' + p.admin2 : '') + (p.country ? ' · ' + p.country : '');
          b.addEventListener('click', function () {
            settings.place = { name: p.name, admin1: p.admin1 || '', country: p.country || '', latitude: p.latitude, longitude: p.longitude };
            saveSettings(); store.set('weather', null);
            $('#placeNow').textContent = '현재: ' + placeLabel(settings.place);
            box.innerHTML = ''; loadWeather();
          });
          box.appendChild(b);
        });
      })
      .catch(function () { box.innerHTML = '<small>검색하지 못했어요. 인터넷 연결을 확인하세요.</small>'; });
  });

  /* ---------- 전체 화면, 화면 꺼짐 방지 ---------- */
  // 홈 화면 앱으로 열었으면 이미 전체 화면이라 버튼이 필요 없다
  var asApp = false;
  try { asApp = matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches; } catch (e) {}
  if (asApp) $('#bFull').hidden = true;
  function enterFull() {
    try { if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {}); } catch (e) {}
  }
  $('#bFull').addEventListener('click', function () {
    if (document.fullscreenElement) { settings.full = false; try { document.exitFullscreen(); } catch (e) {} }
    else { settings.full = true; enterFull(); }
    saveSettings();
  });
  // 전체 화면을 켜 둔 상태에서 뒤로가기·화면 꺼짐 등으로 풀리면, 다음에 화면을 누를 때 다시 전체 화면으로 돌아간다
  // (브라우저는 사용자가 누르지 않으면 전체 화면을 못 켜게 막는다)
  document.addEventListener('pointerup', function () { if (settings.full && !asApp) enterFull(); }, true);
  var wakeLock = null;
  function keepAwake() {
    if (wakeLock || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    navigator.wakeLock.request('screen').then(function (l) {
      wakeLock = l; l.addEventListener('release', function () { wakeLock = null; });
    }).catch(function () {});
  }
  document.addEventListener('visibilitychange', function () { keepAwake(); render(); schedule(); });

  applyTheme(); render(); schedule(); loadWeather(); keepAwake();
})();
</script>
